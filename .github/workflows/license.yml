name: Adicionar cabeçalho de licença

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  license:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v3

      - name: Instalar Go (requisito para skywalking-eyes)
        uses: actions/setup-go@v4
        with:
          go-version: 1.21

      - name: Instalar Skywalking Eyes
        run: |
          curl -sSfL https://raw.githubusercontent.com/apache/skywalking-eyes/main/scripts/install.sh | sh
          echo "$HOME/.skywalking-eyes/bin" >> $GITHUB_PATH

      - name: Injetar conteúdo do LICENSE no .licenserc.yaml
        run: |
          LICENSE_CONTENT=$(awk '{print "      " $0}' LICENSE | sed '1s/^/    content: |\\n/')
          awk '/content: ""/ { print LICENSE_CONTENT; next }1' LICENSE_CONTENT="$LICENSE_CONTENT" .licenserc.yaml > .licenserc.tmp.yaml
          mv .licenserc.tmp.yaml .licenserc.yaml

      - name: Rodar Skywalking Eyes para aplicar cabeçalhos
        run: |
          license-eye fix

      - name: Commit e push automático das alterações
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "🤖 Adiciona cabeçalhos de licença automaticamente"
          git push
